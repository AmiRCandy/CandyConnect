# ═══════════════════════════════════════════════════════════
#  CandyConnect - Docker Compose
#  Works on Linux, macOS, and Windows (Docker Desktop)
# ═══════════════════════════════════════════════════════════

services:
  # ── Redis Database ──
  redis:
    image: redis:7-alpine
    container_name: candyconnect-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - candyconnect-net

  # ── CandyConnect Server ──
  candyconnect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: candyconnect-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${CC_PANEL_PORT:-8443}:${CC_PANEL_PORT:-8443}"
      # VPN protocol ports - uncomment only the ones you need.
      # WARNING: Ports 443 and 53 often conflict with host services.
      # Only enable them if you are sure nothing else uses them.
      # - "443:443"           # V2Ray / Xray VLESS (conflicts with web servers)
      - "8080:8080"         # V2Ray / Xray VMess-WS (default inbound)
      - "51820:51820/udp" # WireGuard
      - "1194:1194/udp" # OpenVPN
      - "500:500/udp" # IKEv2
      - "4500:4500/udp" # IKEv2 NAT-T
      - "1701:1701/udp" # L2TP
      # - "53:53/udp"       # DNSTT (conflicts with systemd-resolved)
      # - "9443:9443"       # TrustTunnel (HTTP/1.1, HTTP/2)
      # - "9443:9443/udp"   # TrustTunnel (QUIC)
      # SlipStream shares "53:53/udp" with DNSTT (see above)
    environment:
      - CC_DATA_DIR=/opt/candyconnect
      - CC_REDIS_URL=redis://redis:6379/0
      - CC_JWT_SECRET=${CC_JWT_SECRET:-}
      - CC_PANEL_PORT=${CC_PANEL_PORT:-8443}
      - CC_PANEL_PATH=${CC_PANEL_PATH:-/candyconnect}
      - CC_ADMIN_USER=${CC_ADMIN_USER:-admin}
      - CC_ADMIN_PASS=${CC_ADMIN_PASS:-admin123}
      - CC_DOMAIN=${CC_DOMAIN:-vpn.candyconnect.io}
    volumes:
      - candyconnect_data:/opt/candyconnect/cores
      - candyconnect_backups:/opt/candyconnect/backups
      - candyconnect_logs:/opt/candyconnect/logs
      # Keep VPN keys/certificates across container re-creation
      - candyconnect_wireguard:/etc/wireguard
      - candyconnect_openvpn:/etc/openvpn
      - candyconnect_ipsec:/etc/ipsec.d
    devices:
      - /dev/net/tun:/dev/net/tun
    # Required for VPN protocol management (iptables, network config)
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - candyconnect-net

volumes:
  redis_data:
    driver: local
  candyconnect_data:
    driver: local
  candyconnect_backups:
    driver: local
  candyconnect_logs:
    driver: local
  candyconnect_wireguard:
    driver: local
  candyconnect_openvpn:
    driver: local
  candyconnect_ipsec:
    driver: local

networks:
  candyconnect-net:
    driver: bridge
