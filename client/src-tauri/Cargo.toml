[package]
name = "candy-connect"
version = "1.1.1"
description = "CandyConnect VPN Client"
authors = ["AmiRCandy"]
license = ""
repository = "https://github.com/AmiRCandy/CandyConnect"
edition = "2021"
rust-version = "1.71"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc.13", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.0.0-rc.17", features = ["tray-icon"] }

tauri-plugin-log = "2.0.0-rc"
tauri-plugin-fs = "2.0.0-rc"
libc = "0.2"
# Built-in SSH client (DNSTT SSH tunnel mode) — pure Rust crypto, no OpenSSL
russh = "0.49"
async-trait = "0.1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
windows-sys = { version = "0.52", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Registry", "Win32_Networking_WinInet"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
